<a class="skip-link" href="#main">Skip to content</a>

<!-- Site header -->
<header class="modern-header" [class.scrolled]="isScrolled()">
  <div class="header-top">
    <div class="container">
      <div class="header-top__inner">
        <div class="contact-info">
          <a href="tel:+918447133338"><app-icon name="phone" /> +91 8447133338</a>
          <a href="mailto:contact@happyghumakkads.com"><app-icon name="envelope" /> contact&#64;happyghumakkads.com</a>
        </div>
        <div class="social-links">
          <a href="https://www.facebook.com/happyghumakkads" target="_blank" rel="noopener" aria-label="Facebook" class="social-link"><app-icon name="facebook-f" /></a>
          <a href="https://www.instagram.com/happyghumakkads" target="_blank" rel="noopener" aria-label="Instagram" class="social-link"><app-icon name="instagram" /></a>
          <a href="https://www.twitter.com/happyghumakkads" target="_blank" rel="noopener" aria-label="Twitter" class="social-link"><app-icon name="twitter" /></a>
          <a href="https://www.youtube.com/happyghumakkads" target="_blank" rel="noopener" aria-label="YouTube" class="social-link"><app-icon name="youtube" /></a>
        </div>
      </div>
    </div>
  </div>

  <nav class="main-nav" aria-label="Primary">
    <div class="container">
      <div class="main-nav__inner">
        <a class="brand" routerLink="/" (click)="closeMobileMenu()">
          <img src="/images/cropped-Logo-png-400.webp" alt="" class="brand-logo" width="400" height="489">
          <span class="brand-text">
            <span class="brand-name">Happy Ghumakkads</span>
            <span class="brand-tagline">Discover Incredible India</span>
          </span>
        </a>

        <div class="nav-menu" [class.show]="isMenuOpen()" id="primary-menu">
          <div class="nav-menu__inner">
          <ul class="nav-list">
            <li class="nav-item">
              <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/packages" routerLinkActive="active" (click)="closeMobileMenu()">Packages</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()">About Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/careers" routerLinkActive="active" (click)="closeMobileMenu()">Careers</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">Contact</a>
            </li>
          </ul>
          <a class="btn btn-warning btn-sm nav-menu__cta" routerLink="/contact" (click)="closeMobileMenu()">Book Now</a>
          </div>
        </div>

        <div class="header-actions">
          <a class="btn btn-warning btn-sm header-actions__book" routerLink="/contact">Book Now</a>

          <button
            class="mobile-menu-toggle"
            type="button"
            (click)="toggleMobileMenu()"
            [class.is-open]="isMenuOpen()"
            [attr.aria-expanded]="isMenuOpen()"
            aria-controls="primary-menu"
            aria-label="Toggle navigation menu">
            <span class="hamburger-icon">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
            </span>
          </button>
        </div>
      </div>
    </div>
  </nav>
</header>

<!-- Main content -->
<main class="main-content" id="main">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>

<!-- Scroll to top -->
<button
  type="button"
  class="scrollToTop"
  [class.show]="showScrollTop()"
  (click)="scrollToTop()"
  aria-label="Scroll back to top">
  <app-icon name="arrow-up" />
</button>

<!-- WhatsApp -->
<a
  class="whatsapp-float"
  href="https://wa.me/918447133338"
  target="_blank"
  rel="noopener"
  aria-label="Chat with us on WhatsApp">
  <app-icon name="whatsapp" />
</a>
